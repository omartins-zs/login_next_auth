version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: login_nextauth_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXTAUTH_URL: http://localhost:8080
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-eA0q4oR7e4e1aQvQfG5VnjP8t2vG9FfC4hH8tI7L7M}
    networks:
      - login_network

  nginx:
    image: nginx:1.25-alpine
    container_name: login_nextauth_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - login_network

networks:
  login_network:
    driver: bridge
